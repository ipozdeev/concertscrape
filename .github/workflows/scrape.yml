name: scrape and publish

on:
  schedule:
    # every 2 days at 06:00 UTC (matches the old RaspberryPi cadence)
    - cron: "0 6 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Scrape and build calendar.ics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: uv run concertscrape run --output-dir docs

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/calendar.ics; then
            echo "no changes to publish"
          else
            git add docs/calendar.ics
            git commit -m "chore: update calendar.ics [skip ci]"
            git push
          fi
